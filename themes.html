<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Theme options · Daniel Fu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@400;500;600&family=Big+Shoulders+Display:wght@700;900&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=Inter+Tight:wght@500;700;800;900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Cormorant+SC:wght@500;600&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#e9e7e2;color:#1b1b1b;font-family:"Hanken Grotesk",system-ui,sans-serif}
img{max-width:100%;display:block}
a{color:inherit}
.picker{position:sticky;top:0;z-index:10;background:#1b1b1b;color:#f4f2ee;padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.picker p{margin:0;font-size:14px}
.picker nav{display:flex;gap:6px;flex-wrap:wrap}
.picker a{color:#1b1b1b;background:#f4f2ee;text-decoration:none;font-size:13px;font-weight:600;padding:6px 10px;border-radius:2px}
.wrap{max-width:1200px;margin:0 auto;padding:24px 16px 80px;display:grid;gap:56px}
.label{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;margin:0 0 12px}
.label b{font-size:22px}
.label span{font-size:15px;color:#555;max-width:70ch}
.frame{border-radius:6px;overflow:hidden;box-shadow:0 1px 0 rgba(0,0,0,.08),0 12px 40px rgba(0,0,0,.12)}
.frame img{width:100%;height:100%;object-fit:cover}

/* shared skeleton */
.fx{padding:0 clamp(16px,4vw,56px) clamp(32px,5vw,64px)}
.fx-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 0;flex-wrap:wrap}
.fx-nav nav{display:flex;gap:18px;flex-wrap:wrap}
.fx-nav nav a{text-decoration:none}
.fx-hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:clamp(20px,4vw,56px);align-items:end;padding:clamp(24px,5vw,64px) 0}
.fx-hero h1{margin:0}
.fx-hero p{margin:0}
.fx-cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.fx-cta a{text-decoration:none}
.fx-hero figure{margin:0;aspect-ratio:3/4;max-height:520px}
.fx-hero figcaption{margin-top:8px}
.fx-sec{padding-top:clamp(28px,4vw,48px)}
.fx-sec h2{margin:0 0 20px}
.fx-paper{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:24px;align-items:start}
.fx-paper h3{margin:8px 0}
.fx-paper p{margin:0 0 10px}
.fx-plate{display:grid;gap:8px}
.fx-plate .doc{aspect-ratio:620/802;background:#fff}
.fx-plate .doc img{object-fit:contain}
.fx-awards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}
.fx-awards div{display:flex;flex-direction:column;gap:4px}
.fx-photos{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:12px}
.fx-photos figure{margin:0;aspect-ratio:3/4}
.fx-art{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.fx-art figure{margin:0}
.fx-art .im{aspect-ratio:3/4}
.fx-art figcaption{margin-top:8px}
@media (max-width:720px){
  .fx-hero{grid-template-columns:minmax(0,1fr)}
  .fx-hero figure{max-height:380px}
  .fx-paper{grid-template-columns:minmax(0,1fr)}
  .fx-plate{grid-template-columns:120px minmax(0,1fr);align-items:end}
  .fx-awards{grid-template-columns:minmax(0,1fr)}
  .fx-photos{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fx-photos figure:first-child{grid-column:1/-1;aspect-ratio:4/3}
  .fx-art{grid-template-columns:repeat(2,minmax(0,1fr))}
}

/* A · Gallery */
.t-a{background:#fbfaf7;color:#161616;font-family:"Hanken Grotesk",sans-serif}
.t-a .fx-nav{border-bottom:1px solid #e3e0d8;font-size:14px}
.t-a .fx-mark{font-family:"Instrument Serif",serif;font-size:24px}
.t-a .fx-nav nav a{color:#666}
.t-a .fx-eyebrow{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#7a766c;margin-bottom:18px!important}
.t-a h1{font-family:"Instrument Serif",serif;font-weight:400;font-size:clamp(64px,10vw,140px);line-height:.9;letter-spacing:-.02em}
.t-a .fx-tag{font-family:"Instrument Serif",serif;font-style:italic;font-size:clamp(26px,3.2vw,40px);color:#e4472b;margin-top:10px!important}
.t-a .fx-lede{font-size:18px;line-height:1.6;max-width:44ch;margin-top:20px!important;color:#333}
.t-a .fx-cta a{font-size:14px;font-weight:600;padding:10px 16px;border:1px solid #161616;border-radius:999px}
.t-a .fx-cta a:first-child{background:#161616;color:#fbfaf7}
.t-a .fx-hero figure{background:#efece5;padding:18px}
.t-a figcaption{font-size:12px;color:#7a766c;letter-spacing:.02em}
.t-a figcaption b{color:#161616;font-weight:600}
.t-a .fx-sec{border-top:1px solid #e3e0d8;margin-top:24px}
.t-a h2{font-family:"Instrument Serif",serif;font-weight:400;font-size:44px}
.t-a h2 .num{font-family:"Hanken Grotesk";font-size:13px;color:#e4472b;vertical-align:top;margin-right:10px}
.t-a .status{font-size:12px;font-weight:600;color:#e4472b;letter-spacing:.06em;text-transform:uppercase}
.t-a .fx-paper h3{font-family:"Instrument Serif",serif;font-weight:400;font-size:30px;line-height:1.1}
.t-a .fx-paper p{font-size:16px;line-height:1.6;color:#333}
.t-a .pdf{display:inline-block;font-size:14px;font-weight:600;text-decoration:none;border-bottom:1px solid #e4472b;color:#e4472b}
.t-a .big{font-family:"Instrument Serif",serif;font-size:40px;line-height:1}
.t-a .fx-plate .doc{border:1px solid #e3e0d8}
.t-a .fx-awards div{border-top:1px solid #161616;padding-top:10px}
.t-a .fx-awards b{font-family:"Instrument Serif",serif;font-weight:400;font-size:28px}
.t-a .fx-awards small{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#7a766c}
.t-a .fx-awards span{font-size:14px;color:#555}
.t-a .fx-art .im{background:#efece5;padding:14px}

/* B · Workshop */
.t-b{background:#cfcbc2;color:#111;font-family:"Barlow",sans-serif;background-image:radial-gradient(rgba(0,0,0,.05) 1px,transparent 1px);background-size:6px 6px}
.t-b .fx-nav{font-family:"Barlow Condensed";font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:.06em}
.t-b .fx-mark{background:#111;color:#ffd400;padding:4px 10px;font-family:"Big Shoulders Display";font-weight:900;font-size:22px;letter-spacing:.02em}
.t-b .fx-hero{background:#111;color:#f2efe8;margin:0 calc(-1*clamp(16px,4vw,56px));padding:clamp(28px,5vw,56px) clamp(16px,4vw,56px);border-top:14px solid transparent;border-image:repeating-linear-gradient(-45deg,#ffd400 0 14px,#111 14px 28px) 14}
.t-b .fx-eyebrow{font-family:"Barlow Condensed";font-weight:600;text-transform:uppercase;letter-spacing:.1em;font-size:14px;color:#ffd400;margin-bottom:12px!important}
.t-b h1{font-family:"Big Shoulders Display",sans-serif;font-weight:900;text-transform:uppercase;font-size:clamp(72px,12vw,168px);line-height:.82;letter-spacing:-.01em}
.t-b .fx-tag{font-family:"Barlow Condensed";font-weight:700;text-transform:uppercase;font-size:clamp(22px,2.6vw,32px);margin-top:12px!important;color:#ffd400}
.t-b .fx-lede{font-size:18px;line-height:1.55;max-width:46ch;margin-top:16px!important;color:#d9d5cc}
.t-b .fx-cta a{font-family:"Barlow Condensed";font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:16px;padding:10px 16px;background:#ffd400;color:#111}
.t-b .fx-cta a:last-child{background:transparent;color:#ffd400;outline:2px solid #ffd400;outline-offset:-2px}
.t-b .fx-hero figure{border:6px solid #2b2b2b;position:relative}
.t-b figcaption{font-family:"Barlow Condensed";font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:13px}
.t-b .fx-hero figcaption{color:#aaa}
.t-b h2{font-family:"Big Shoulders Display";font-weight:900;text-transform:uppercase;font-size:56px;line-height:.9}
.t-b h2 .num{display:inline-block;background:#ffd400;font-size:24px;padding:4px 8px;margin-right:10px;vertical-align:middle}
.t-b .fx-paper,.t-b .fx-awards div{background:#f2efe8;border:2px solid #111;padding:18px;position:relative}
.t-b .fx-paper::before,.t-b .fx-paper::after{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:#888;box-shadow:inset 0 0 0 2px #555;top:8px;left:8px}
.t-b .fx-paper::after{left:auto;right:8px}
.t-b .status{font-family:"Barlow Condensed";font-weight:700;text-transform:uppercase;background:#ffd400;padding:2px 8px;font-size:14px;letter-spacing:.06em}
.t-b .fx-paper h3{font-family:"Barlow Condensed";font-weight:700;font-size:28px;line-height:1.05;text-transform:uppercase}
.t-b .fx-paper p{font-size:16px;line-height:1.55}
.t-b .pdf{display:inline-block;font-family:"Barlow Condensed";font-weight:700;text-transform:uppercase;letter-spacing:.06em;background:#111;color:#ffd400;padding:8px 12px;text-decoration:none}
.t-b .big{font-family:"Big Shoulders Display";font-weight:900;font-size:44px;line-height:1}
.t-b .fx-awards b{font-family:"Big Shoulders Display";font-weight:900;text-transform:uppercase;font-size:30px;line-height:1}
.t-b .fx-awards div:nth-child(2){background:#ffd400}
.t-b .fx-awards small{font-family:"Barlow Condensed";font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.t-b .fx-photos figure,.t-b .fx-art .im{border:2px solid #111}

/* C · Editorial */
.t-c{background:#fff;color:#0d0d0d;font-family:"Source Serif 4",serif}
.t-c .fx-nav{font-family:"Inter Tight";font-weight:700;font-size:14px;border-bottom:3px solid #0d0d0d}
.t-c .fx-mark{font-family:"Inter Tight";font-weight:900;font-size:18px}
.t-c .fx-mark::before{content:"";display:inline-block;width:12px;height:12px;background:#ff3b1f;margin-right:8px}
.t-c .fx-hero{grid-template-columns:minmax(0,1fr);align-items:start;gap:20px}
.t-c .fx-eyebrow{font-family:"Inter Tight";font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:#ff3b1f}
.t-c h1{font-family:"Inter Tight",sans-serif;font-weight:900;font-size:clamp(84px,17vw,230px);line-height:.8;letter-spacing:-.055em}
.t-c .fx-hero-text{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.t-c .fx-tag{font-family:"Inter Tight";font-weight:800;font-size:clamp(26px,3.4vw,44px);letter-spacing:-.02em;border-top:3px solid #0d0d0d;padding-top:14px}
.t-c .fx-lede{font-size:20px;line-height:1.5;max-width:52ch}
.t-c .fx-cta a{font-family:"Inter Tight";font-weight:700;font-size:15px;padding:12px 18px;background:#0d0d0d;color:#fff}
.t-c .fx-cta a:last-child{background:#ff3b1f}
.t-c .fx-hero figure{aspect-ratio:16/7;max-height:none}
.t-c figcaption{font-family:"Inter Tight";font-weight:500;font-size:12px;color:#555}
.t-c .fx-sec{border-top:3px solid #0d0d0d;margin-top:32px}
.t-c h2{font-family:"Inter Tight";font-weight:900;font-size:64px;letter-spacing:-.04em;line-height:.9}
.t-c h2 .num{color:#ff3b1f;margin-right:12px}
.t-c .status{font-family:"Inter Tight";font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#fff;background:#0d0d0d;padding:3px 8px}
.t-c .fx-paper h3{font-family:"Inter Tight";font-weight:800;font-size:32px;line-height:1.02;letter-spacing:-.02em}
.t-c .fx-paper p{font-size:17px;line-height:1.55}
.t-c .pdf{display:inline-block;font-family:"Inter Tight";font-weight:800;font-size:14px;color:#ff3b1f;text-decoration:none}
.t-c .big{font-family:"Inter Tight";font-weight:900;font-size:52px;letter-spacing:-.04em;line-height:.9;color:#ff3b1f}
.t-c .fx-awards{gap:0;border-top:1px solid #0d0d0d;border-bottom:1px solid #0d0d0d}
.t-c .fx-awards div{padding:14px 14px 14px 0;border-right:1px solid #0d0d0d}
.t-c .fx-awards div:last-child{border-right:0}
.t-c .fx-awards div+div{padding-left:14px}
.t-c .fx-awards b{font-family:"Inter Tight";font-weight:900;font-size:26px;letter-spacing:-.02em}
.t-c .fx-awards small{font-family:"Inter Tight";font-weight:700;font-size:12px;color:#ff3b1f;text-transform:uppercase}
@media (max-width:720px){.t-c .fx-awards div{border-right:0;border-bottom:1px solid #0d0d0d;padding-left:0!important}.t-c .fx-hero figure{aspect-ratio:4/3}}

/* D · Library */
.t-d{background:#15302a;color:#efe7d6;font-family:"EB Garamond",serif}
.t-d .fx-nav{font-family:"Cormorant SC";font-weight:600;font-size:17px;letter-spacing:.06em;border-bottom:1px solid rgba(239,231,214,.25)}
.t-d .fx-nav nav a{color:#cdbf9f}
.t-d .fx-mark{font-family:"Cormorant Garamond";font-weight:700;font-size:24px;color:#d6b25e}
.t-d .fx-hero{grid-template-columns:minmax(0,1fr);text-align:center;justify-items:center}
.t-d .fx-eyebrow{font-family:"Cormorant SC";font-weight:600;letter-spacing:.14em;font-size:15px;color:#d6b25e;margin-bottom:10px!important}
.t-d h1{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:clamp(72px,11vw,150px);line-height:.88;letter-spacing:-.01em}
.t-d .fx-tag{font-family:"Cormorant Garamond";font-style:italic;font-weight:500;font-size:clamp(26px,3vw,38px);color:#d6b25e;margin-top:8px!important}
.t-d .fx-tag::before,.t-d .fx-tag::after{content:" ❧ ";font-style:normal;font-size:.7em;opacity:.7}
.t-d .fx-lede{font-size:20px;line-height:1.6;max-width:48ch;margin:16px auto 0!important;color:#ddd3bd}
.t-d .fx-cta{justify-content:center}
.t-d .fx-cta a{font-family:"Cormorant SC";font-weight:600;letter-spacing:.08em;font-size:17px;padding:8px 18px;border:1px solid #d6b25e;color:#d6b25e}
.t-d .fx-hero figure{width:min(320px,70%);aspect-ratio:3/4;padding:14px;background:#efe7d6;margin-top:16px}
.t-d .fx-hero figcaption{color:#5a4f3b;font-style:italic;font-size:14px;text-align:center}
.t-d figcaption{font-style:italic;font-size:15px;color:#cdbf9f}
.t-d .fx-sec{text-align:left;border-top:1px solid rgba(239,231,214,.25);margin-top:20px}
.t-d h2{font-family:"Cormorant Garamond";font-weight:600;font-size:52px;text-align:center}
.t-d h2 .num{display:block;font-family:"Cormorant SC";font-size:16px;letter-spacing:.2em;color:#d6b25e}
.t-d .status{font-family:"Cormorant SC";font-weight:600;letter-spacing:.12em;color:#d6b25e;font-size:15px}
.t-d .fx-paper h3{font-family:"Cormorant Garamond";font-weight:700;font-size:32px;line-height:1.1}
.t-d .fx-paper p{font-size:18px;line-height:1.6;color:#ddd3bd}
.t-d .pdf{display:inline-block;font-family:"Cormorant SC";font-weight:600;letter-spacing:.08em;font-size:17px;color:#d6b25e;text-decoration:none;border-bottom:1px solid #d6b25e}
.t-d .big{font-family:"Cormorant Garamond";font-weight:700;font-size:46px;color:#d6b25e;line-height:1}
.t-d .fx-plate .doc{padding:8px;background:#efe7d6}
.t-d .fx-awards div{text-align:center;border:1px solid rgba(214,178,94,.5);padding:16px}
.t-d .fx-awards b{font-family:"Cormorant Garamond";font-weight:700;font-size:28px}
.t-d .fx-awards small{font-family:"Cormorant SC";letter-spacing:.14em;color:#d6b25e}
.t-d .fx-awards span{color:#cdbf9f;font-style:italic}
.t-d .fx-photos figure,.t-d .fx-art .im{padding:8px;background:#efe7d6}
</style>
</head>
<body>
<div class="picker">
  <p><b>Theme options</b> · same content, four looks. Tell Claude A, B, C or D (or mix them).</p>
  <nav><a href="#a">A · Gallery</a><a href="#b">B · Workshop</a><a href="#c">C · Editorial</a><a href="#d">D · Library</a><a href="./">current site</a></nav>
</div>
<main class="wrap" id="themes"></main>
<template id="tpl">
  <div class="fx">
    <header class="fx-nav"><span class="fx-mark">Daniel Fu</span><nav><a href="#">Research</a><a href="#">High Stakes</a><a href="#">Art</a><a href="#">Reading</a><a href="#">Contact</a></nav></header>
    <section class="fx-hero">
      <div class="fx-hero-text">
        <p class="fx-eyebrow">Markham, Ontario · Unionville High School · Class of 2027</p>
        <h1>Daniel Fu</h1>
        <p class="fx-tag">I look at what's left over.</p>
        <p class="fx-lede">I plan to study data science. My work runs from S&amp;P&nbsp;500 options to blood biomarkers to a sculpture of a hand, and most of it is one habit applied to different data.</p>
        <div class="fx-cta"><a href="#">Research</a><a href="#">Art portfolio</a></div>
      </div>
      <figure><div style="height:100%"><img src="hand-1-t.jpg" alt="Hand sculpture"></div><figcaption><b>Hand</b>, AP 3D Art &amp; Design, 2026</figcaption></figure>
    </section>
    <section class="fx-sec">
      <h2><span class="num">02</span>Research</h2>
      <article class="fx-paper">
        <div>
          <span class="status">Accepted · 11th Derivative Markets Conference</span>
          <h3>What Survives a Delta Hedge? Curvature, Jump Exposure, and the Maturity Clock in SPX Options</h3>
          <p>Craig Vishwesh, Tanya Otsetarova (Citadel Securities), <b>Daniel Fu</b></p>
          <p>Large hedging errors near expiry turn out to be mainly a curvature effect, not jumps. The answer was a null, so we wrote down what our test could not detect.</p>
          <a class="pdf" href="paper-dmc-what-survives-a-delta-hedge.pdf">Read the paper · PDF</a>
        </div>
        <div class="fx-plate"><div class="doc"><img src="paper-dmc-t.jpg" alt="First page of the paper"></div><div><div class="big">1,243,969</div><figcaption>intraday observations audited</figcaption></div></div>
      </article>
    </section>
    <section class="fx-sec">
      <h2><span class="num">05</span>High Stakes</h2>
      <div class="fx-awards">
        <div><small>Sep 2024</small><b>Create Award</b><span>Highlander Summit Signature Event</span></div>
        <div><small>Dec 2024</small><b>Tournament Champions</b><span>RiverBots III Signature Event</span></div>
        <div><small>2025</small><b>World Championship</b><span>Innovate Division</span></div>
      </div>
      <div class="fx-photos">
        <figure><img src="hs2-p-hero-t.jpg" alt="Iteration 2 robot"></figure>
        <figure><img src="hs1-p-hotel-t.jpg" alt="Iteration 1 robot"></figure>
        <figure style="background:#ddd"><img src="hs3-cad-1-t.jpg" alt="Iteration 3 CAD" style="object-fit:contain"></figure>
      </div>
    </section>
    <section class="fx-sec">
      <h2><span class="num">06</span>Art</h2>
      <div class="fx-art">
        <figure><div class="im"><img src="box-1-t.jpg" alt="Box"></div><figcaption><b>Box</b> · 3D</figcaption></figure>
        <figure><div class="im"><img src="spine-1-t.jpg" alt="Spine"></div><figcaption><b>Spine</b> · 3D</figcaption></figure>
        <figure><div class="im"><img src="claw-f-t.jpg" alt="Robot hands" style="object-fit:contain"></div><figcaption><b>Robot hands</b> · drawing</figcaption></figure>
        <figure><div class="im"><img src="wheel-1-t.jpg" alt="Wheel"></div><figcaption><b>Wheel</b> · 3D</figcaption></figure>
      </div>
    </section>
  </div>
</template>
<script>
var T=[
 ['a','A · Gallery','White walls, a classic serif and one vermilion accent. Your art leads, and the research reads like museum labels. Light, calm, art-school.'],
 ['b','B · Workshop','Concrete grey, black and caution-tape yellow, with condensed industrial type and riveted plates. Loud, maker-first, built around Caution Tape Robotics.'],
 ['c','C · Editorial','Pure white, huge black grotesk headlines, thick rules and a red accent. Reads like a magazine spread: bold, clean, confident.'],
 ['d','D · Library','Deep green and cream, an old-style serif with small caps and gold rules. Literary and warm, a nod to the reading and the essays.']
];
